name: J4 P2 batch 3 bounded verification
on:
  push:
    branches: ['j4/p2c-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - run: yarn install --ignore-scripts
      - name: Project tests
        run: yarn test --runInBand --json --outputFile=project-tests.json
      - name: Component characterization
        run: BABEL_ENV=test yarn jest --runInBand --testMatch '**/j4.characterize.spec.js'
      - name: Boot and characterize
        run: |
          yarn serve --port 3000 > boot.log 2>&1 &
          python3 j4_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            surface.actual.json
            components.actual.json
            project-tests.*
            target/surefire-reports/*.xml
            boot.log
            seed-results.json
            yarn.lock
          retention-days: 30
